<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Death Note - Pro</title>
  <style>
    :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; padding-bottom: 80px; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    .page-panel { display: none; } .page-panel.active { display: block; }
    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px; z-index: 1000; }
    .nav-item { color: #94a3b8; cursor: pointer; font-size: 12px; text-align: center; }
    .nav-item.active { color: #818cf8; }
    input, textarea, select { width: 100%; padding: 8px; margin: 4px 0; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; }
    .img-thumb { max-width: 100px; height: auto; border-radius: 4px; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- 1. HATA ANALİZİ (İSTENEN YAPI) -->
  <div id="panel-errors" class="page-panel active">
    <h3>⚠️ Hata Analizi ve Soru Havuzu</h3>
    
    <!-- Filtreler -->
    <div class="card">
        <select id="filterSubject" onchange="renderErrors()">
            <option value="Hepsi">Tüm Dersler</option>
            <option value="Türkçe">Türkçe</option>
            <option value="Matematik">Matematik</option>
            <option value="Fizik">Fizik</option>
            <option value="Kimya">Kimya</option>
            <option value="Biyoloji">Biyoloji</option>
            <option value="Geometri">Geometri</option>
            <option value="Sosyal">Sosyal</option>
        </select>
        <select id="filterType" onchange="renderErrors()">
            <option value="Benim">Sadece Benim Hatalarım</option>
            <option value="Toplu">Toplu Hata Havuzu</option>
        </select>
    </div>

    <!-- Hata Ekle Formu -->
    <div class="card">
        <input type="text" id="errDesc" placeholder="Soru/Hata Açıklaması">
        <select id="errSub">
            <option value="Türkçe">Türkçe</option> <option value="Matematik">Matematik</option>
            <option value="Biyoloji">Biyoloji</option> <option value="Fizik">Fizik</option>
            <option value="Kimya">Kimya</option> <option value="Geometri">Geometri</option>
        </select>
        <select id="errOwner"><option value="Benim">Benim Hatam</option><option value="Toplu">Toplu Havuz</option></select>
        <input type="file" id="errPhoto" accept="image/*">
        <button class="btn" onclick="addError()">Hatayı Kaydet</button>
    </div>

    <div id="errorList"></div>
  </div>

  <!-- 2. NAVİGASYON -->
  <div class="nav-bottom">
    <div class="nav-item active" onclick="showPanel('errors', this)">⚠️<br>Hatalar</div>
    <div class="nav-item" onclick="showPanel('analytics', this)">📊<br>Deneme</div>
  </div>

  <script>
    function showPanel(p, el) {
      document.querySelectorAll('.page-panel').forEach(div => div.classList.remove('active'));
      document.getElementById('panel-' + p).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    }

    // --- HATA HAVUZU MANTIĞI ---
    let errors = JSON.parse(localStorage.getItem('my_errors') || '[]');

    function addError() {
        const fileInput = document.getElementById('errPhoto');
        const file = fileInput.files[0];
        
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                saveData(e.target.result);
            };
            reader.readAsDataURL(file);
        } else {
            saveData(null);
        }
    }

    function saveData(imgData) {
        const err = {
            desc: document.getElementById('errDesc').value,
            sub: document.getElementById('errSub').value,
            type: document.getElementById('errOwner').value,
            img: imgData
        };
        errors.push(err);
        localStorage.setItem('my_errors', JSON.stringify(errors));
        renderErrors();
        alert("Başarıyla eklendi.");
    }

    function renderErrors() {
        const subFilter = document.getElementById('filterSubject').value;
        const typeFilter = document.getElementById('filterType').value;
        
        const list = document.getElementById('errorList');
        list.innerHTML = errors.filter(e => 
            (subFilter === "Hepsi" || e.sub === subFilter) && 
            (e.type === typeFilter)
        ).map(e => `
            <div class="card">
                <strong>[${e.sub}]</strong> ${e.desc}
                ${e.img ? `<br><img src="${e.img}" class="img-thumb">` : ''}
            </div>
        `).join('');
    }

    renderErrors();
  </script>
</body>
</html>
