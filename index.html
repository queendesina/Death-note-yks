<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Social Death Note</title>
  <!-- PWA için gerekli tanımlar -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"YKS DeathNote","short_name":"DeathNote","start_url":"./","display":"standalone","background_color":"#0b0f19","theme_color":"#6366f1"}'>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151f32;
      --card-inner: #1e2d4a;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #233354;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 75px; }

    header { background: var(--card); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .user-badge { background: var(--card-inner); padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); }
    
    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-btn.active { color: var(--primary); font-weight: bold; }

    .container { padding: 15px; max-width: 800px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 15px; }
    .card-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; }
    textarea { resize: vertical; min-height: 70px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; font-size: 14px; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--card-inner); border: 1px solid var(--border); }
    .btn-group { display: flex; gap: 8px; }

    .tdk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 10px; }
    .tdk-card { background: var(--card-inner); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .tdk-word { font-weight: bold; color: var(--accent); font-size: 14px; }
    .tdk-meaning { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .subject-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .subject-btn { background: var(--card-inner); border: 1px solid var(--border); padding: 15px; border-radius: 10px; color: white; font-weight: bold; text-align: left; cursor: pointer; }
    .sub-tabs { display: flex; gap: 5px; margin-bottom: 15px; background: var(--card-inner); padding: 5px; border-radius: 8px; }
    .sub-tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .sub-tab-btn.active { background: var(--primary); color: white; }

    .task-item { background: var(--card-inner); padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 13px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); transition: all 0.2s; }
    .task-item.completed { opacity: 0.5; text-decoration: line-through; }
    .task-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); margin: 0; }

    .error-post { background: var(--card-inner); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .error-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
    .error-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; margin: 8px 0; background: #000; }

    .chat-box { height: 250px; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
    .chat-msg { margin-bottom: 8px; font-size: 13px; }
    .chat-msg .sender { font-weight: bold; color: var(--primary); }

    .dy-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
    .dy-table td, .dy-table th { padding: 6px; font-size: 12px; text-align: center; }
    .dy-table input { margin: 0; padding: 4px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div style="font-weight: bold; font-size: 18px; color: var(--primary);">YKS DeathNote</div>
    <div class="user-badge" id="currentUserDisplay">👤 @ogrenci1</div>
  </header>

  <div class="container">
    <div id="p-home" class="panel active">
      <div class="card">
        <div class="card-title">📖 TDK Günün 10 Kelimesi</div>
        <div class="tdk-grid" id="tdkContainer"></div>
      </div>

      <div class="card" style="text-align: center;">
        <div class="card-title" style="justify-content: center;">⏱️ Çalışma Takibi</div>
        <h1 id="timerDisplay" style="font-size: 42px; margin: 15px 0; font-family: monospace;">00:00:00</h1>
        <div class="btn-group">
          <button class="btn" onclick="toggleTimer()">Başlat / Durdur</button>
          <button class="btn btn-secondary" onclick="resetTimer()">Sıfırla</button>
        </div>
      </div>
    </div>

    <!-- ... (Diğer Paneller aynı kalıyor, koda sığması için burayı kısalttım, sen eski kodunun tamamını yapıştırabilirsin) ... -->
    <!-- (Aşağıdaki script kısmı önemli) -->
  </div>

      navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",()=>{});').catch(console.error);
    }
    
    // Uygulama Mantığı (Aynı kalacak)
    const currentUser = "@ogrenci1";

    // TDK ve Task renderları vb.
    initTDK();
    renderTasks();
  </script>
</body>
</html>
