<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKS Social Death Note</title>
  <style>
    :root { --bg: #0b0f19; --card: #151f32; --card-inner: #1e2d4a; --primary: #6366f1; --accent: #10b981; --text: #f8fafc; --text-muted: #94a3b8; --border: #233354; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 75px; }

    /* Giriş Ekranı Stili */
    #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    
    header { background: var(--card); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .user-badge { background: var(--card-inner); padding: 6px 12px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); }
    
    .container { padding: 15px; max-width: 800px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 15px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
    input { width: 100%; padding: 10px; margin: 10px 0; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; }
    
    .panel { display: none; }
    .panel.active { display: block; }
    .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login-overlay">
    <h2 style="color: var(--primary); margin-bottom: 20px;">YKS DeathNote</h2>
    <p style="margin-bottom: 10px;">Kullanıcı adını girerek başla:</p>
    <input type="text" id="usernameInput" placeholder="Örn: Ahmet">
    <button class="btn" onclick="login()">Giriş Yap</button>
  </div>

  <header>
    <div style="font-weight: bold; font-size: 18px; color: var(--primary);">YKS DeathNote</div>
    <div class="user-badge" id="currentUserDisplay">👤 Giriş bekleniyor...</div>
  </header>

  <div class="container">
    <div id="p-home" class="panel active">
      <div class="card">
        <h3>Hoş geldin!</h3>
        <p>Programın ve analizlerin burada yerel olarak tutuluyor.</p>
      </div>
    </div>
    <!-- (Diğer panellerin aynen burada kalacak...) -->
  </div>

  <script>
    // Giriş Kontrolü
    function login() {
      const name = document.getElementById('usernameInput').value;
      if(name) {
        localStorage.setItem('yks_username', name);
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('currentUserDisplay').innerText = '👤 ' + name;
      }
    }

    // Sayfa açıldığında isim kayıtlı mı kontrol et
    window.onload = function() {
      const savedUser = localStorage.getItem('yks_username');
      if(savedUser) {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('currentUserDisplay').innerText = '👤 ' + savedUser;
      }
    };
  </script>
</body>
</html>
