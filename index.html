<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Master - Pro Plan</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #6366f1; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 80px; }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #334155; }
        .nav-btn { cursor: pointer; color: #94a3b8; font-size: 14px; }
        .nav-btn.active { color: var(--primary); font-weight: bold; }
        .dy-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 5px; }
        .error-img { max-width: 100%; border-radius: 8px; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <!-- 1. DENEME ANALİZİ -->
    <div id="tab-analysis" class="tab-content active">
        <h2>📊 Deneme Analizi</h2>
        <div class="card">
            <input type="text" id="tName" placeholder="Deneme Adı">
            <input type="date" id="tDate">
            <div class="dy-row"><span>Ders</span><span>D</span><span>Y</span></div>
            <div class="dy-row"><span>Türkçe</span><input type="number" id="trD"><input type="number" id="trY"></div>
            <div class="dy-row"><span>Mat</span><input type="number" id="maD"><input type="number" id="maY"></div>
            <div class="dy-row"><span>Sosyal</span><input type="number" id="soD"><input type="number" id="soY"></div>
            <div class="dy-row"><span>Fen</span><input type="number" id="feD"><input type="number" id="feY"></div>
            <div class="dy-row"><span>Geo</span><input type="number" id="geD"><input type="number" id="geY"></div>
            <textarea id="tNotes" placeholder="Genel notlar ve eksikler..."></textarea>
            <button onclick="saveTrial()">Analizi Kaydet</button>
        </div>
        <div id="trialList"></div>
    </div>

    <!-- 2. HATA DEFTERİ (TOPLU) -->
    <div id="tab-errors" class="tab-content">
        <h2>⚠️ Hata Defteri</h2>
        <div class="card">
            <select id="errSub">
                <option value="Türkçe">Türkçe</option><option value="Matematik">Matematik</option>
                <option value="Geometri">Geometri</option><option value="Fizik">Fizik</option>
                <option value="Kimya">Kimya</option><option value="Biyoloji">Biyoloji</option>
            </select>
            <input type="text" id="errTopic" placeholder="Konu Başlığı">
            <textarea id="errDesc" placeholder="Hata detayı..."></textarea>
            <input type="file" id="errFile" accept="image/*">
            <button onclick="saveError()">Hatayı Havuza Ekle</button>
        </div>
        <div id="errorList"></div>
    </div>

    <!-- 3. DERSLER -->
    <div id="tab-subjects" class="tab-content">
        <h2>📚 Dersler</h2>
        <div class="card">
            <h3>TYT / AYT / GEO</h3>
            <p>Ders seç ve notlarını/hafıza kartlarını yönet.</p>
            <select id="subjectSelect">
                <option value="TYT-Türkçe">TYT Türkçe</option>
                <option value="TYT-Matematik">TYT Matematik</option>
                <option value="AYT-Matematik">AYT Matematik</option>
                <option value="AYT-Sayısal">AYT Sayısal (Fen)</option>
                <option value="Geometri">Geometri</option>
            </select>
            <textarea id="subNote" placeholder="Buraya önemli bilgileri veya formülleri yaz..."></textarea>
            <button onclick="saveNote()">Notu Kaydet</button>
        </div>
    </div>

    <!-- NAVIGASYON -->
    <div class="nav">
        <div class="nav-btn active" onclick="switchTab('analysis')">📊 Analiz</div>
        <div class="nav-btn" onclick="switchTab('errors')">⚠️ Hata</div>
        <div class="nav-btn" onclick="switchTab('subjects')">📚 Dersler</div>
    </div>

    <script>
        // --- CORE FUNCTIONS ---
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // --- DATA HANDLERS ---
        function saveTrial() {
            const data = {
                name: document.getElementById('tName').value,
                date: document.getElementById('tDate').value,
                tr: document.getElementById('trD').value + "/" + document.getElementById('trY').value,
                ma: document.getElementById('maD').value + "/" + document.getElementById('maY').value,
                notes: document.getElementById('tNotes').value
            };
            let trials = JSON.parse(localStorage.getItem('trials') || '[]');
            trials.push(data);
            localStorage.setItem('trials', JSON.stringify(trials));
            renderTrials();
        }

        function renderTrials() {
            const list = document.getElementById('trialList');
            const trials = JSON.parse(localStorage.getItem('trials') || '[]');
            list.innerHTML = trials.map(t => `<div class="card"><strong>${t.name}</strong><br>Tr: ${t.tr} | Mat: ${t.ma}<br><small>${t.notes}</small></div>`).join('');
        }

        function saveError() {
            const file = document.getElementById('errFile').files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const err = {
                    sub: document.getElementById('errSub').value,
                    topic: document.getElementById('errTopic').value,
                    desc: document.getElementById('errDesc').value,
                    img: e.target.result
                };
                let errors = JSON.parse(localStorage.getItem('errors') || '[]');
                errors.push(err);
                localStorage.setItem('errors', JSON.stringify(errors));
                renderErrors();
            };
            if (file) reader.readAsDataURL(file);
            else alert("Lütfen fotoğraf seç!");
        }

        function renderErrors() {
            const list = document.getElementById('errorList');
            const errors = JSON.parse(localStorage.getItem('errors') || '[]');
            list.innerHTML = errors.map(e => `
                <div class="card">
                    <strong>${e.sub} - ${e.topic}</strong>
                    <p>${e.desc}</p>
                    <img src="${e.img}" class="error-img">
                </div>
            `).join('');
        }

        // Init
        renderTrials();
        renderErrors();
    </script>
</body>
</html>
